name: Profile assets (streak + snake)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/streak.py"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/streak.py

      - name: Commit streak.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || (git commit -m "chore: update streak card" && git push)

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8b5cf6&color_dots=#0a1020,#0b3a52,#0a6c8f,#00b4d8,#00f0ff&color_dot_border=#05070f

      - name: Add dark background to snake.svg
        run: sed -i '0,/<svg[^>]*>/s||&<rect x="-200" y="-200" width="4000" height="4000" fill="#05070f"/>|' dist/snake.svg

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
