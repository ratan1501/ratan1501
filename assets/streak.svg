.ring{stroke-dasharray:326.7;stroke-dashoffset:326.7;animation:draw 1.6s .4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:40.8}}
.b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .5s ease-out forwards}
@keyframes grow{to{transform:scaleY(1)}}
</style>
</defs>
